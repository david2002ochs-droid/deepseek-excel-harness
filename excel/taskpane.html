<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness</title>
    <style>
      html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
      body { overflow: hidden; }
    </style>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <iframe title="DeepSeek Harness" id="harness"></iframe>
    <script type="module">
      import { installExcelContextBridge } from './context.mjs';
      Office.onReady(() => {
        const frame = document.getElementById('harness');
        const url = new URL(__EXCEL_HARNESS_URL__);
        const dispose = installExcelContextBridge({ window, frame, office: Office, excel: Excel, origin: url.origin });
        window.addEventListener('pagehide', dispose, { once: true });
        frame.src = url.href;
      });
    </script>
  </body>
</html>
